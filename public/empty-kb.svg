<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>An open book with ideas rising from it</title>
  <style>
    .idea { animation: bob 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .idea-2 { animation-delay: -.8s; } .idea-3 { animation-delay: -1.6s; }
    .idea-4 { animation-delay: -2.4s; } .idea-5 { animation-delay: -3.2s; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .idea { animation: none; } }
  </style>

  <!-- open book -->
  <g>
    <path d="M62 288 C108 274 170 278 200 300 C230 278 292 274 338 288 L340 298 C294 286 232 290 200 308 C168 290 106 286 60 298 Z" fill="#a51d24" />
    <path d="M66 288 C110 276 170 280 200 300 C230 280 290 276 334 288 L332 282 C290 270 232 272 200 292 C168 272 110 270 68 282 Z" fill="#e7e8eb" stroke="#c9ccd2" stroke-width="1" />
    <path d="M70 282 L92 204 C132 190 176 194 200 214 L200 292 C170 270 110 268 70 282 Z" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.2" />
    <path d="M330 282 L308 204 C268 190 224 194 200 214 L200 292 C230 270 290 268 330 282 Z" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.2" />
    <path d="M200 214 C192 206 182 202 176 202 L184 280 C190 282 196 286 200 292 Z" fill="#eceef1" />
    <path d="M200 214 C208 206 218 202 224 202 L216 280 C210 282 204 286 200 292 Z" fill="#eceef1" />
    <path d="M200 214 L200 292" stroke="#b9bdc5" stroke-width="1.2" />
    <g stroke="#e3e5e9" stroke-width="1.4">
      <path d="M104 222 C130 214 160 214 182 224" />
      <path d="M100 236 C128 228 158 228 182 238" />
      <path d="M96 250 C124 242 156 242 182 252" />
      <path d="M296 222 C270 214 240 214 218 224" />
      <path d="M300 236 C272 228 242 228 218 238" />
      <path d="M304 250 C276 242 244 242 218 252" />
    </g>
  </g>

  <!-- dashed trails from the book to each idea -->
  <g stroke="#1f1f21" stroke-width="1.6" stroke-dasharray="4 4">
    <path d="M150 240 C130 224 114 218 100 216" />
    <path d="M178 226 C170 198 152 176 126 154" />
    <path d="M200 228 C186 190 214 152 200 104" />
    <path d="M222 226 C238 190 262 152 292 122" />
    <path d="M246 238 C268 216 290 202 312 196" />
    <ellipse cx="160" cy="184" rx="9" ry="5.5" transform="rotate(-30 160 184)" />
    <ellipse cx="208" cy="160" rx="8" ry="5" />
    <ellipse cx="262" cy="150" rx="8" ry="5" transform="rotate(20 262 150)" />
    <ellipse cx="290" cy="206" rx="5.5" ry="8" />
  </g>

  <!-- globe -->
  <g class="idea idea-1">
    <circle cx="62" cy="214" r="38" fill="#8cc63f" />
    <path d="M71 189 A25 25 0 0 1 71 235" stroke="#caa58a" stroke-width="4.5" />
    <circle cx="60" cy="212" r="19" fill="#7cc8f3" stroke="#1f1f21" stroke-width="2" />
    <path d="M42 216 C50 220 70 220 79 214 C78 224 70 231 60 231 C50 231 43 224 42 216 Z" fill="#43a5e6" />
    <path d="M54 199 C60 196 66 200 64 206 C62 210 66 214 62 218 C58 220 54 214 52 210 C50 206 50 202 54 199 Z" fill="#b8d94a" stroke="#1f1f21" stroke-width="1.6" />
    <path d="M70 203 C74 206 76 212 72 216" stroke="#1f1f21" stroke-width="1.6" fill="#b8d94a" />
    <path d="M60 231 L60 240" stroke="#1f1f21" stroke-width="2" />
    <path d="M48 248 C50 240 70 240 72 248 Z" fill="#a6abb3" stroke="#1f1f21" stroke-width="2" />
  </g>

  <!-- comet -->
  <g class="idea idea-2">
    <circle cx="98" cy="118" r="38" fill="#4f1d7c" />
    <path d="M80 132 C74 116 82 98 100 92 C98 100 104 102 110 94 C112 102 118 102 124 96 C124 108 122 122 114 132 C104 144 86 144 80 132 Z" fill="#88cff6" stroke="#1f1f21" stroke-width="2" />
    <path d="M86 116 L100 110 L110 120 L106 134 L92 137 L84 127 Z" fill="#62788c" stroke="#1f1f21" stroke-width="2" />
    <circle cx="101" cy="119" r="1.8" fill="#1f1f21" />
    <circle cx="94" cy="130" r="2.2" fill="#1f1f21" />
    <circle cx="103" cy="129" r="2.4" stroke="#1f1f21" stroke-width="1.4" />
    <path d="M82 138 C92 142 104 142 112 138" stroke="#1f1f21" stroke-width="1.4" />
  </g>

  <!-- brain -->
  <g class="idea idea-3">
    <circle cx="200" cy="62" r="40" fill="#e0006b" />
    <path d="M206 78 C208 86 206 92 204 98" stroke="#1f1f21" stroke-width="6.5" />
    <path d="M206 78 C208 86 206 92 204 98" stroke="#f6b37e" stroke-width="3.5" />
    <path d="M178 66 C170 54 180 40 194 44 C198 34 214 32 220 42 C232 40 240 52 232 62 C238 72 228 82 218 78 C212 84 200 84 196 78 C184 82 174 76 178 66 Z" fill="#f6bcae" stroke="#1f1f21" stroke-width="2" />
    <g stroke="#1f1f21" stroke-width="1.5">
      <path d="M190 52 C194 56 190 62 194 66" />
      <path d="M204 44 C200 50 206 56 202 62" />
      <path d="M216 52 C212 56 218 62 214 68" />
      <path d="M184 70 C190 70 192 74 198 72" />
      <path d="M224 60 C220 64 224 70 220 72" />
    </g>
    <path d="M214 74 C220 72 226 76 224 80 C220 82 214 80 214 74 Z" fill="#f29a7a" stroke="#1f1f21" stroke-width="1.5" />
  </g>

  <!-- virus -->
  <g class="idea idea-4">
    <circle cx="316" cy="92" r="38" fill="#ea4a1f" />
    <g stroke="#1f1f21" stroke-width="2">
      <path d="M316 77 L316 69" /><path d="M316 107 L316 115" />
      <path d="M301 92 L293 92" /><path d="M331 92 L339 92" />
      <path d="M305 81 L299 75" /><path d="M327 103 L333 109" />
      <path d="M327 81 L333 75" /><path d="M305 103 L299 109" />
    </g>
    <g fill="#d81f4b" stroke="#1f1f21" stroke-width="1.6">
      <circle cx="316" cy="67" r="3.4" /><circle cx="316" cy="117" r="3.4" />
      <circle cx="291" cy="92" r="3.4" /><circle cx="341" cy="92" r="3.4" />
      <circle cx="297" cy="73" r="3.4" /><circle cx="335" cy="111" r="3.4" />
      <circle cx="335" cy="73" r="3.4" /><circle cx="297" cy="111" r="3.4" />
    </g>
    <circle cx="316" cy="92" r="16" fill="#5ec1c3" stroke="#1f1f21" stroke-width="2" />
    <circle cx="310" cy="88" r="2.6" fill="#f08a6e" />
    <circle cx="322" cy="96" r="2.2" fill="#f08a6e" />
    <circle cx="319" cy="84" r="1.6" fill="#f08a6e" />
  </g>

  <!-- test tube -->
  <g class="idea idea-5">
    <circle cx="348" cy="190" r="36" fill="#fbd84b" />
    <g transform="rotate(-18 348 190)">
      <path d="M340 168 L340 206 A8 8 0 0 0 356 206 L356 168" fill="#ffffff" stroke="#1f1f21" stroke-width="2" />
      <path d="M340 186 C346 184 350 188 356 186 L356 206 A8 8 0 0 1 340 206 Z" fill="#e8318a" stroke="#1f1f21" stroke-width="2" />
      <path d="M343 192 L343 204" stroke="#ffffff" stroke-width="1.6" />
      <rect x="337" y="165" width="22" height="5" rx="2.5" fill="#ffffff" stroke="#1f1f21" stroke-width="2" />
      <rect x="341" y="155" width="14" height="10" rx="2" fill="#b07a3e" stroke="#1f1f21" stroke-width="2" />
    </g>
  </g>
</svg>
